name: Archive Preflight
description: Scan repository archives for unsafe or nonportable member paths.
inputs:
  archives:
    description: Newline-separated repository-relative glob patterns for archives.
    required: true
  max-members:
    description: Maximum number of members to inspect in each archive.
    required: false
    default: '10000'
  max-total-size:
    description: Maximum declared uncompressed bytes to inspect in each archive.
    required: false
    default: '1073741824'
  report-format:
    description: Report format to emit (text, json, or sarif).
    required: false
    default: text
  report-path:
    description: Optional repository-relative path for the report file.
    required: false
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Install Archive Preflight
      shell: bash
      env:
        ARCHIVE_PREFLIGHT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ARCHIVE_PREFLIGHT_ACTION_PATH"
    - name: Scan archives
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARCHIVE_PREFLIGHT_ACTION_PATH: ${{ github.action_path }}
        ARCHIVE_PREFLIGHT_ARCHIVES: ${{ inputs.archives }}
        ARCHIVE_PREFLIGHT_MAX_MEMBERS: ${{ inputs.max-members }}
        ARCHIVE_PREFLIGHT_MAX_TOTAL_SIZE: ${{ inputs.max-total-size }}
        ARCHIVE_PREFLIGHT_REPORT_FORMAT: ${{ inputs.report-format }}
        ARCHIVE_PREFLIGHT_REPORT_PATH: ${{ inputs.report-path }}
      run: python "$ARCHIVE_PREFLIGHT_ACTION_PATH/tools/action_entry.py"

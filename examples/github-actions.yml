name: Archive preflight

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      # Replace this build stage with the release build used by your project.
      - name: Build release archives
        run: |
          python -m pip install build
          python -m build

      - name: Inspect built archives
        uses: ./
        with:
          archives: |
            dist/*.whl
            dist/*.tar.gz
          max-members: '10000'
          max-total-size: '1073741824'
          report-format: sarif
          report-path: archive-preflight.sarif

      # Optional: see ../docs/github-actions.md before explicitly enabling
      # github/codeql-action/upload-sarif. The composite action never uploads.

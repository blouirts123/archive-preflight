name: GitHub Action smoke
on:
  push:
    branches: [main]
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - pyproject.toml
      - src/archive_preflight/**
      - tools/action_entry.py
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - pyproject.toml
      - src/archive_preflight/**
      - tools/action_entry.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Generate harmless ZIP fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          fixture_dir = Path("action-smoke-fixtures")
          fixture_dir.mkdir()
          with ZipFile(fixture_dir / "clean.zip", "w") as archive:
              archive.writestr("readme.txt", "Generated smoke fixture.\n")
          with ZipFile(fixture_dir / "collision.zip", "w") as archive:
              archive.writestr("Report.txt", "First harmless member.\n")
              archive.writestr("report.TXT", "Second harmless member.\n")
          PY
      - name: Scan a clean archive as text
        uses: ./
        with:
          archives: action-smoke-fixtures/clean.zip
          report-format: text
      - name: Write a JSON finding report
        id: json_report
        continue-on-error: true
        uses: ./
        with:
          archives: action-smoke-fixtures/collision.zip
          report-format: json
          report-path: action-smoke-report.json
      - name: Confirm JSON finding exits nonzero
        if: steps.json_report.outcome != 'failure'
        shell: bash
        run: exit 1
      - name: Verify JSON report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("action-smoke-report.json").read_text(encoding="utf-8"))
          assert report["schema_version"] == 1
          assert report["kind"] == "batch"
          assert report["ok"] is False
          assert len(report["results"]) == 1
          assert report["results"][0]["report"]["findings"]
          PY
      - name: Write a SARIF finding report
        id: sarif_report
        continue-on-error: true
        uses: ./
        with:
          archives: action-smoke-fixtures/collision.zip
          report-format: sarif
          report-path: action-smoke-report.sarif
      - name: Confirm SARIF finding exits nonzero
        if: steps.sarif_report.outcome != 'failure'
        shell: bash
        run: exit 1
      - name: Verify SARIF report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("action-smoke-report.sarif").read_text(encoding="utf-8"))
          assert report["version"] == "2.1.0"
          assert report["runs"][0]["results"]
          assert report["runs"][0]["invocations"][0]["exitCode"] == 1
          PY
